            17. Posibilitatea de a înregistra și rula rutine pe mai multe monitoare, cu opțiunea de a:
                - selecta manual monitorul;
                - sau de a lăsa aplicația să urmărească automat unde se deplasează mouse-ul.

            18. Utilizarea uneia sau mai multor librării GUI performante, orientate spre stabilitate și execuție fluentă, pentru a preveni crash-uri sau interacțiuni riscante cu aplicațiile externe. Să existe permanent controale vizibile și ușor accesibile pentru pauză, oprire sau reluare în siguranță a rutinei.

