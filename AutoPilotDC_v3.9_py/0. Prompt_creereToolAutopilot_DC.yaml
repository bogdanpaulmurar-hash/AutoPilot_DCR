                - pornește rutina care execută aceiași pași asupra fiecărei valori din listă;
                - rezultatele sunt extrase și scrise automat în Excel.

            11. Posibilitatea de a introduce timpi de așteptare (delay) după anumiți pași sau înainte de executarea unor acțiuni specifice.

            12. Rutina să poată conține mai mulți pași structurați (Pasul 1, Pasul 2 etc.), fiecare cu opțiuni avansate, precum:
