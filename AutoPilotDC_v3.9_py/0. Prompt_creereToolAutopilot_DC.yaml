        2. Posibilitatea de a inregistra gesturi fie cu mouse, fie cu tastatura, fie combinatie de taste fie toate intr-o singura inregistrare
        3. Aplicatia sa documenteze fiecare pas pe care il face, fiecare gest fiecare apasare de taste, totul sa inregistreze intr-un log care poate fi downloadat in diferite formate insa important ar fi .xslx
