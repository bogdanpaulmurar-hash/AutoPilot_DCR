        10. Posibilitatea ca rutina sa porneasca utilizand un excel cu date. De ex. pe coloana si celula a1:a100 am o lista de valori care trebuie pe rand copiate si incarcate intr-un tool din care se va face o extractie de date si se va insera totul in excel. Eu incarc lista, aleg rutina, si pornesc rutina deja inregistrata mai demult care performeaza exact aceeasi pasi utilizand doar liste noi.
        11. Posibiltiatea ca in rutina sa introduc un timp de asteptare dupa un anumit pas.
        12. Posibilitatea ca o rutina sa contina mai multi pasi programati. Pasul 1 pasul 2...etc si intre pasi sa am optiuni avansate de a introduce diferse functii. Tipuri de click, dreapta sau stanga, 2-3 5 clickuri.. la alegere, timp de asteptare, butoane de a muta pasii rutinei sus sau jos, omite pas, pune o intrebare si insereaza butoane personalizate pentru continuare sau oprire sau a sari peste acest pas... si altele pe care le vezi relevante pentru subiectul acesta. Sa am optiuni in rutine sa inregistrez ecranul si sa recunoasca butoanele si ele sa fie apasate prin diferite tiputi de clickuri, (1,2,3,...la alegere), sau click dreapta. Acea inregistrare sa repereze toate butoanele, toti locatorii de pe acea captura si sa aiba posibilitatea ca pe acelasi ecran, pe aceeasi rezolutie sa inregistreze locatorii fiecarui buton sau camp care trebuie selectat, fie copiate datele din acel camp in excel sau sa extraga date din campuri needitabile sau neselectabile, sau sa actioneze un oare care buton de pe acea pagina. totul sa poata fi realizat prin acea captura, care poate fi editata, pot fi pastrate anumite detalii de acolo de ex, butonul OK, Submit... etc. Sau campul Ibase, sau UEID.. sau oricare alt camp identificat cu care poate face o rutina, o actiune combo intr-un planificator de rutine avansat, descris mai sus. Adauga optiunea de a nu vedea cum se deplaseaza mouse-ul si actioneaza un buton ci de a muta direct mouse-ul pe locator si a actiona in functie de cum este setat.
        13. Aplicatia desi avansata si cu un cod foarte bine structurat (tot codul sa fie explicat in detaliu cu // si cu despartitoare pe tot randul si pas cu pas...cu 1 - 2 - 3..  si ce face fiecare linie, functie... etc si sa fie structurata pe parti ca daca vreau sa modific ulterior ceva in cod, sa pot lua doar partea relevanta) sa aiba o performanta buna, sa fie asa gandita ca sa mearga bine, fluent sa nu se opreasca pentru ca a colidat o parte din cod cu alta din cauza acestor multe functii avansate, si sa poata preintampina in functie de rutina probleme de performanta. daca e prea incarcata rutina sa apara mesaj care sa informeze acest lucru, si sa se poata alege la a omite unii pasi pe care ii recomanda rutina ca sa imbunatateasca performanta aplicatiei
