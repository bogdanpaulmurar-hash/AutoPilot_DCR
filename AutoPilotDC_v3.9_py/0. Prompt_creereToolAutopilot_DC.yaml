        5. Logul sa fie fie in tab separat de cel in care se inregistreaza toata actiunea, rutina pe care o inregistrez cand apas un buton si sa existe optiuni da a marca in textul din log campuri, sau celule (excel) in care rutina a intampinat probleme, s-a oprit si a trecut un comentariu, sau daca rezultatul acelei rutine nu a urmat cursul inregistrat.
        6. Daca rutina, gesturile intampina un pop up sau o eroare, sa extraga tot din eroare si sa logheze mesajul in log si sa intrebe daca se contonua rutina sau daca se opreste, iar actiunea sa aiba posibilitatea ca sa apese pe diferite butoane in functie de decizia celui pe care o foloseste.
        7. Sa existe posibilitatea sau un buton floating in rutina sau undeva care sa permita oprirea de urgenta a rutinei, daca cel care verifica ce face rutina, considera ca trebuie oprita. Poate si optiunea de a seta individual de fiecare data o combinatie de taste pentru functia aceasta in rutina.
        8. Optiuni avansate in rutina care urmeaza sa fie creata, + optiunea de a seta key shortcuts pentru start, stop, pauze.. samd. Oricum aceste combinatii sa fie vizualizate intr-un gui tot asa floating in timp ce rutina ruleaza, si sa poti apasa orice combinatie ca sa poti pune pe pauza rutina sau sa faci alta actiune.
