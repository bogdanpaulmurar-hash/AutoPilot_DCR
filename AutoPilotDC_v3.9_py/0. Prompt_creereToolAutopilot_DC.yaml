                - explicat pas cu pas, cu comentarii clare (1, 2, 3…) pentru fiecare funcție și secțiune;
                - ușor de extins sau modificat ulterior;
                - optimizat pentru performanță, astfel încât funcțiile să nu intre în conflict.

                Dacă o rutină devine prea încărcată, aplicația trebuie:
                - să afișeze un mesaj de avertizare;
                - să recomande eliminarea sau omisiunea unor pași pentru creșterea performanței.

            14. Aplicația să suporte mai multe teme de culoare, bine alese și cu contraste corecte pentru lizibilitate și ergonomie.

