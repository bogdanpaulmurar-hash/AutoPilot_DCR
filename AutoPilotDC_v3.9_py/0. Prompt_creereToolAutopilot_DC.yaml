        15. Sa am optiuni avansate in dropdownuri gen file edit section view help... etc care sa fie deja functionale si sa includa setari relevante pentru toata aplicatia, sa pot seta culori  pentru butoane, sa pot alege forme pentru butoane, sa pot customiza cat crezi ca este in limitele performantei bune, ca sa nu am probleme cu aplciatia din cauza tuturor acestor functii.
